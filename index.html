<style>
:root{--teal:#0f766e;--teal2:#14b8a6;--bg:#f0fdfa;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:10;background:var(--teal);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.top{display:flex;align-items:center;justify-content:space-between;max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:7px;font-weight:800;font-size:20px;letter-spacing:-.01em}
.status{font-size:12px;opacity:.95;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#fbbf24}.dot.on{background:#4ade80}.dot.err{background:#f87171}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(15,23,42,.06);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar-in{max-width:600px;margin:0 auto;display:flex}
.tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--mut);padding:4px 2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tabbar button .ic{font-size:22px;line-height:1;filter:grayscale(1);opacity:.6}
.tabbar button.act{color:var(--teal)}.tabbar button.act .ic{filter:none;opacity:1}
main{max-width:980px;margin:0 auto;padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));z-index:60;background:#0f172a;color:#fff;padding:11px 12px 11px 16px;border-radius:14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);width:max-content;max-width:92vw;font-size:14px;font-weight:600}
.toast button{background:var(--teal2);color:#fff;border:0;border-radius:9px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.lk.lbig{display:block;text-align:center;padding:13px 8px;font-size:15px;border-radius:11px}
details.more summary{cursor:pointer;color:var(--teal);font-weight:700;font-size:14px;padding:8px 0;list-style:none;-webkit-tap-highlight-color:transparent}
details.more summary::-webkit-details-marker{display:none}
.steps{display:grid;gap:10px}
.step{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.step .n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.howto{background:#ecfeff;border:1px solid #a5f3fc}
.xbtn{background:none;border:0;font-size:22px;line-height:1;color:var(--mut);cursor:pointer;padding:0 4px}
.route{font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.plist .pi{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.plist .pi:last-child{border-bottom:0}
.plist a{color:var(--teal);font-weight:600;text-decoration:none}
.flist{margin-top:4px}
.fl{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.fl.ko{opacity:.55}
.fl-r{text-align:right;flex-shrink:0}
.fl .t{font-size:15px;font-weight:800}
.scanhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:2px 0 2px}
.combo-best{background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:10px 12px;margin:8px 0 4px}
.combo-best .leg{font-size:14px;margin-top:5px;line-height:1.35}
.combo-best .tot{font-size:21px;font-weight:800;color:var(--teal);margin-top:6px}
.sub{margin-top:12px}
.sub .sh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.itin{padding:0;overflow:hidden}
.itin.best{border:2px solid var(--teal2)}
.itin .ih{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:14px 14px 10px}
.icity{font-size:19px;font-weight:800;line-height:1.15}
.icode{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.04em;margin-top:2px}
.iprice{font-size:26px;font-weight:900;color:var(--teal);line-height:1;text-align:right}
.iprice-s{font-size:11px;color:var(--mut);text-align:right;margin-top:3px}
.ibadge{display:inline-block;margin:0 14px 8px;background:var(--teal);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.03em}
.lgblock{border-top:1px dashed #cbd5e1;padding:10px 14px 12px}
.lgh{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--mut);margin-bottom:6px}
.lgh .lgtag{color:#fff;background:#0f766e;border-radius:6px;padding:2px 7px}
.lgh .lgtag.r{background:#7c3aed}
.leg2{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.leg2 .tm{font-size:22px;font-weight:800;line-height:1}
.leg2 .tm sup{font-size:11px;color:#b45309;margin-left:2px}
.leg2 .ap{font-size:12px;color:var(--mut);font-weight:800;margin-top:3px;letter-spacing:.04em}
.leg2 .r{text-align:right}
.lmid{text-align:center;min-width:0}
.lline{height:2px;background:#cbd5e1;position:relative;margin:5px 4px}
.lline::before,.lline::after{content:'';position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;background:#cbd5e1}
.lline::before{left:-4px}.lline::after{right:-4px}
.lline.stop i{position:absolute;left:50%;top:-4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff;border:2px solid #d97706}
.ldur{font-size:11px;color:var(--mut);font-weight:600}
.lstop{font-size:11px;color:var(--ok);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lstop.s{color:#b45309}
.lgair{font-size:13px;font-weight:700;margin-top:6px}
.lgair span{font-weight:500;color:var(--mut)}
.ifoot{padding:10px 14px 14px;border-top:1px solid var(--line);background:#fafafa}
.alt{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.alt.ko{opacity:.5}
.alt .at{font-weight:800}
.alt .ap2{font-weight:800;color:var(--teal);white-space:nowrap}
.secttl{font-size:13px;font-weight:800;color:var(--mut);letter-spacing:.05em;text-transform:uppercase;margin:16px 2px 8px}
details.card > summary{cursor:pointer;font-weight:800;list-style:none}
details.card > summary::-webkit-details-marker{display:none}
.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(15,23,42,.08);margin-bottom:12px}
label.f{display:block;font-size:11px;font-weight:700;color:var(--mut);margin:0 0 4px;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #99f6e4;border-color:var(--teal2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mt{margin-top:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:#ccfbf1;color:var(--teal)}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid #99f6e4}
.btn.danger{background:#fee2e2;color:var(--bad)}
.btn.small{padding:7px 10px;font-size:13px}
.btn.full{width:100%}
.seg{display:inline-flex;background:#e2e8f0;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;color:var(--mut);cursor:pointer;font-size:14px}
.seg button.act{background:#fff;color:var(--teal);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.picker{position:relative}
.chips{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff;min-height:46px;align-items:center}
.chips input{border:0;flex:1;min-width:110px;padding:4px;outline:none}
.chip{background:#ccfbf1;color:#115e59;border-radius:999px;padding:4px 4px 4px 10px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.chip small{font-weight:500;opacity:.8}
.chip button{border:0;background:transparent;color:#115e59;font-size:17px;line-height:1;cursor:pointer;padding:0 5px}
.sugg{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:4px;z-index:20;box-shadow:0 8px 20px rgba(0,0,0,.12);overflow:hidden}
.sugg div{padding:10px 12px;cursor:pointer;font-size:15px}.sugg div:hover{background:#f0fdfa}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick button{border:1px dashed #5eead4;background:#fff;color:var(--teal);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.combo{margin-bottom:0}
.combo .h{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.price{font-size:21px;font-weight:800;color:var(--teal);text-align:right}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.lk{display:inline-block;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;background:#f1f5f9;color:#0f172a}
.lk.meta{background:#e0f2fe;color:#075985}
.lk.air{background:#fef3c7;color:#92400e}
.lk.cmb{background:#ede9fe;color:#5b21b6}
.mut{color:var(--mut)}.small{font-size:12px}.b{font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;vertical-align:middle}
.b-ok{background:#dcfce7;color:#166534}.b-warn{background:#fef3c7;color:#92400e}.b-mut{background:#f1f5f9;color:#475569}.b-teal{background:#ccfbf1;color:#115e59}
.up{color:var(--bad)}.down{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.03em}
td.num,th.num{text-align:right;white-space:nowrap}
.tblwrap{overflow-x:auto}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:640px){.modal-bg{align-items:center}.modal{border-radius:18px}}
.pop .modal{text-align:center;max-width:380px;border-radius:18px;margin:16px}
.pop.modal-bg{align-items:center}
.pop .big{font-size:42px}
h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px}
.empty{padding:26px 10px;text-align:center;color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.banner{background:#fef3c7;color:#92400e;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px;line-height:1.4}
.tripcard{cursor:pointer;transition:transform .1s}.tripcard:active{transform:scale(.99)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:#f0fdfa;border-radius:10px;padding:8px}.stat b{display:block;font-size:16px}.stat span{font-size:11px;color:var(--mut);text-transform:uppercase}
.back{background:none;border:0;color:var(--teal);font-weight:700;font-size:15px;padding:4px 0 10px;cursor:pointer}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.chk input{width:auto}
pre.code{background:#0f172a;color:#e2e8f0;padding:10px;border-radius:10px;font-size:12px;overflow-x:auto}
.ver{font-size:12px;color:var(--mut);text-align:center;margin-top:20px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr 1fr}main{padding-left:10px;padding-right:10px}.card{padding:13px 12px;border-radius:13px}.combos{grid-template-columns:1fr}.brand{font-size:18px}h2{font-size:17px}.stat b{font-size:15px}.btn{padding:11px 14px}}
.fbox .frow{margin-top:12px}
.flab{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.flab .fval{color:var(--teal);text-transform:none;letter-spacing:0;font-size:13px}
.fseg{display:flex;flex-wrap:wrap;width:100%;box-sizing:border-box}
.fseg button{flex:1 1 auto;padding:7px 8px}
.frange{width:100%;accent-color:var(--teal);margin:2px 0}
.frl{display:flex;justify-content:space-between}
.fmore{margin-top:6px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}

.fchk{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:10px;cursor:pointer}
.fchk input{margin-top:3px;accent-color:var(--teal)}
.irow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.irow.ko{opacity:.6}
.irl{min-width:0;display:flex;flex-direction:column;gap:7px}
.ileg{font-size:14px;line-height:1.35}
.itag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;padding:1px 6px;border-radius:5px;background:#ccfbf1;color:var(--teal);margin-right:6px;vertical-align:1px}
.itag.r{background:#e0e7ff;color:#4338ca}
.irp{font-weight:800;color:var(--teal);white-space:nowrap;font-size:17px}
</style>

const pbVar = n => { const o = []; while (n > 127) { o.push((n & 127) | 128); n = Math.floor(n / 128); } o.push(n); return o; };

const pbVI = (f, n) => [...pbVar(f << 3), ...pbVar(n)];

const gfLeg = (d, o, t) => [...pbLD(2, pbStr(d)), ...pbLD(13, pbLD(2, pbStr(o))), ...pbLD(14, pbLD(2, pbStr(t)))];

  return btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

const clean = v => (v == null ? null : JSON.parse(JSON.stringify(v)));
function useStore() {
  const [data, setData] = useState({ viaggi: {}, prezzi: {}, impostazioni: {}, scan: {} });
  const [status, setStatus] = useState(FB_ON ? 'connessione…' : 'locale');
  const [ready, setReady] = useState(!FB_ON);
  const dbRef = useRef(null);
  useEffect(() => {
    if (!FB_ON) {
      try { const raw = localStorage.getItem('voli_data'); if (raw) setData(JSON.parse(raw)); } catch (e) {}
      return;
    }
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database(); dbRef.current = db;
    let off = null;
    firebase.auth().signInAnonymously().catch(e => setStatus('errore: ' + e.message));
    const unsub = firebase.auth().onAuthStateChanged(u => {
      if (!u) return;
      const r = db.ref(ROOT);
      const cb = r.on('value', snap => {
        const v = snap.val() || {};
        setData({ viaggi: v.viaggi || {}, prezzi: v.prezzi || {}, impostazioni: v.impostazioni || {}, scan: v.scan || {} });
        setStatus('online'); setReady(true);
      }, err => setStatus('errore: ' + err.message));
      off = () => r.off('value', cb);
    });
    return () => { unsub(); off && off(); };
  }, []);
  const update = (map) => {
    const m = {}; Object.keys(map).forEach(k => { m[k] = clean(map[k]); });
    if (FB_ON) { if (!dbRef.current) return alert('Database non ancora connesso'); return dbRef.current.ref(ROOT).update(m).catch(e => alert('Errore salvataggio: ' + e.message)); }
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      Object.keys(m).forEach(path => {
        const parts = path.split('/'); let o = next;
        for (let i = 0; i < parts.length - 1; i++) { o[parts[i]] = o[parts[i]] || {}; o = o[parts[i]]; }
        const last = parts[parts.length - 1];
        if (m[path] == null) delete o[last]; else o[last] = m[path];
      });
      try { localStorage.setItem('voli_data', JSON.stringify(next)); } catch (e) {}
      return next;
    });
  };
  const replaceAll = (obj) => {
    const v = { viaggi: obj.viaggi || {}, prezzi: obj.prezzi || {}, impostazioni: obj.impostazioni || {}, scan: obj.scan || {} };
    if (FB_ON) return dbRef.current && dbRef.current.ref(ROOT).set(clean(v));
    setData(v); try { localStorage.setItem('voli_data', JSON.stringify(v)); } catch (e) {}
  };
  return { data, status, ready, update, replaceAll };
}

  const groups = Object.entries(by).map(([k, arr]) => ({
    k, all: arr, last: arr[arr.length - 1], prev: arr.length > 1 ? arr[arr.length - 2] : null,
    min: Math.min(...arr.map(x => x.pp)), max: Math.max(...arr.map(x => x.pp)), n: arr.length
  })).sort((a, b) => a.last.pp - b.last.pp);
  return { ps, groups, best: groups[0] || null, minEver: ps.length ? Math.min(...ps.map(p => p.pp)) : null };
}

// ===== Itinerari completi andata + ritorno, con filtri (v1.5) =====
const FKEY = 'voli_filtri_v1';
const F0 = { stops: 'all', tA: 'any', tR: 'any', max: null, comodi: true, noSep: false, offO: [], offA: [] };
const loadF = () => { try { return JSON.parse(localStorage.getItem(FKEY)) || {}; } catch (e) { return {}; } };
const saveF = f => { try { localStorage.setItem(FKEY, JSON.stringify(f)); } catch (e) {} };
const slotOf = s => { const m = /^(\d{1,2}):/.exec(s || ''); if (!m) return null; const h = +m[1]; return h < 12 ? 'm' : h < 18 ? 'p' : 's'; };
const carriersOf = f => (f && f.airline ? f.airline.split(/\s+e\s+|,\s*/).map(x => x.trim()).filter(Boolean) : []);
const legOk = f => !f || f.ok !== false;
const valsOf = x => (x ? Object.values(x) : []);
const stopTxt2 = f => (f.stops === 0 ? 'diretto' : `${f.stops} scal${f.stops > 1 ? 'i' : 'o'}${f.via ? ' a ' + f.via : ''}`);

function itinsOf(sc, o, d) {
  const out = []; const seen = new Set();
  const add = (a, r, pp) => {
    if (!a || pp == null || isNaN(pp)) return;
    const k = [a.dep, a.arr, a.airline, r ? r.dep : '', r ? r.arr : '', r ? r.airline : ''].join('|');
    if (seen.has(k)) return; seen.add(k);
    out.push({ o, d, a, r: r || null, pp: +pp });
  };
  valsOf(sc.combo).forEach(c => add(c.a, c.r, c.pp));
  if (sc.sel) valsOf(sc.ritorni).forEach(r => add(sc.sel, r, r.pp));
  if (!sc.ritorno) valsOf(sc.voli).forEach(f => add(f, null, f.pp));
  return out.sort((x, y) => x.pp - y.pp);
}
function passesF(it, f) {
  const legs = it.r ? [it.a, it.r] : [it.a];
  if (f.comodi && !legs.every(legOk)) return false;
  if (f.noSep && legs.some(l => l.sep)) return false;
  if (f.stops === 'direct' && legs.some(l => l.stops !== 0)) return false;
  if (f.stops === 'max1' && legs.some(l => l.stops > 1)) return false;
  if (f.tA !== 'any' && slotOf(it.a.dep) !== f.tA) return false;
  if (it.r && f.tR !== 'any' && slotOf(it.r.dep) !== f.tR) return false;
  if (f.max != null && it.pp > f.max) return false;
  if (f.offO.includes(it.o)) return false;
  if (f.offA.length && legs.some(l => carriersOf(l).some(c => f.offA.includes(c)))) return false;
  return true;
}

function FSeg({ value, onChange, opts }) {
  return <div className="seg fseg">{opts.map(([v, l]) => <button key={v} type="button" className={value === v ? 'act' : ''} onClick={() => onChange(v)}>{l}</button>)}</div>;
}
function ItinLeg({ r, f }) {
  return (
    <div className="ileg">

}

function TripOptions({ trip, combos }) {
  const [f, setF] = useState(() => ({ ...F0, ...loadF() }));
  const upd = p => setF(prev => { const nx = { ...prev, ...p }; saveF(nx); return nx; });
  const reset = () => { saveF(F0); setF(F0); };
  const all = combos.map(x => ({ ...x, its: itinsOf(x.sc, x.o, x.d) }));
  const flat = all.flatMap(x => x.its);
  if (!flat.length) return null;
  const ar = flat.some(it => it.r);
  const prices = flat.map(i => i.pp);
  const pMin = Math.floor(Math.min(...prices)), pMax = Math.ceil(Math.max(...prices));
  const carriers = [...new Set(flat.flatMap(it => [...carriersOf(it.a), ...carriersOf(it.r)]))].sort();
  const origins = [...new Set(all.map(x => x.o))];
  const fx = { ...f, max: f.max != null && f.max < pMax ? Math.max(f.max, pMin) : null };
  const res = all.map(x => ({ ...x, list: x.its.filter(it => passesF(it, fx)) }));
  const shown = res.filter(x => x.list.length).sort((a, b) => a.list[0].pp - b.list[0].pp);
  const hidden = res.filter(x => x.its.length && !x.list.length);
  const nShown = res.reduce((s, x) => s + x.list.length, 0);
  const nOn = (fx.stops !== 'all') + (fx.tA !== 'any') + (ar && fx.tR !== 'any') + (fx.max != null) + !!fx.noSep + (fx.offO.length > 0) + (fx.offA.length > 0) + !fx.comodi;
  const tog = (key, v) => upd({ [key]: f[key].includes(v) ? f[key].filter(x => x !== v) : [...f[key], v] });
  const slots = [['any', 'Qualsiasi'], ['m', 'Mattina'], ['p', 'Pomeriggio'], ['s', 'Sera']];
  return <>
    <div className="secttl">✈ Le tue opzioni · dalla più economica</div>
    <div className="card fbox">
      <div className="row"><b>🎛️ Filtri{nOn ? ` · ${nOn} attiv${nOn > 1 ? 'i' : 'o'}` : ''}</b><span className="mut small">{nShown} di {flat.length} itinerari</span></div>
      <div className="frow">
        <div className="flab">Scali</div>
        <FSeg value={fx.stops} onChange={v => upd({ stops: v })} opts={[['all', 'Tutti'], ['direct', 'Solo diretti'], ['max1', 'Max 1 scalo']]} />
      </div>
      <div className="frow">
        <div className="flab">Prezzo massimo a persona: <span className="fval">{fx.max == null ? 'nessun limite' : eur(fx.max)}</span></div>
        <input className="frange" type="range" min={pMin} max={pMax} step="1" value={fx.max == null ? pMax : fx.max} onChange={e => { const v = +e.target.value; upd({ max: v >= pMax ? null : v }); }} />
        <div className="frl mut small"><span>{eur(pMin)}</span><span>{eur(pMax)}</span></div>
      </div>
      <details className="more fmore">
        <summary>Altri filtri: orari, aeroporti, compagnie ▾</summary>
        <div className="frow">
          <div className="flab">Partenza andata</div>
          <FSeg value={fx.tA} onChange={v => upd({ tA: v })} opts={slots} />
        </div>
        {ar && <div className="frow">
          <div className="flab">Partenza ritorno</div>
          <FSeg value={fx.tR} onChange={v => upd({ tR: v })} opts={slots} />
        </div>}
        <div className="mut small" style={{ marginTop: 4 }}>Mattina prima delle 12 · pomeriggio 12–18 · sera dopo le 18</div>
        {origins.length > 1 && <div className="frow">
          <div className="flab">Parto da</div>
          <div className="fchips">{origins.map(o => <button type="button" key={o} className={'fchip' + (f.offO.includes(o) ? '' : ' on')} onClick={() => tog('offO', o)}>{apName(o)}</button>)}</div>
        </div>}
        {carriers.length > 1 && <div className="frow">
          <div className="flab">Compagnie · tocca per escludere</div>
          <div className="fchips">{carriers.map(c => <button type="button" key={c} className={'fchip' + (f.offA.includes(c) ? '' : ' on')} onClick={() => tog('offA', c)}>{c}</button>)}</div>
        </div>}
        <label className="fchk"><input type="checkbox" checked={!!f.comodi} onChange={e => upd({ comodi: e.target.checked })} /><span>Solo voli comodi <span className="mut">(niente arrivi il giorno dopo, cambi di aeroporto, più di 1 scalo o viaggi oltre 12 h)</span></span></label>

function PriceChart({ ps, target }) {
  if (!ps.length) return <div className="empty">Nessun prezzo registrato. Apri la ricerca e usa "Registra prezzo trovato".</div>;
  const W = 640, H = 260, L = 52, R = 12, T = 12, B = 28;
  const series = {};
  ps.forEach(p => { const k = `${p.origine}→${p.destinazione}${p.andata ? ' ' + fmtDs(p.andata) : ''}${p.ritorno ? '–' + fmtDs(p.ritorno) : ''}`; (series[k] = series[k] || []).push(p); });
  const keys = Object.keys(series);
  let x0 = Math.min(...ps.map(p => p.ts)), x1 = Math.max(...ps.map(p => p.ts));
  if (x1 - x0 < 3600000) { x0 -= 43200000; x1 += 43200000; }
  const vals = ps.map(p => p.pp).concat(target ? [target] : []);
  let y0 = Math.min(...vals), y1 = Math.max(...vals);
  const pad = Math.max((y1 - y0) * 0.12, 5); y0 = Math.max(0, y0 - pad); y1 = y1 + pad;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R);
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const yt = [0, 1, 2, 3].map(i => y0 + (y1 - y0) * i / 3);
  const xt = [0, 1, 2, 3].map(i => x0 + (x1 - x0) * i / 3);
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', display: 'block' }}>
        {yt.map((v, i) => <g key={i}><line x1={L} x2={W - R} y1={Y(v)} y2={Y(v)} stroke="#e2e8f0" /><text x={L - 6} y={Y(v) + 4} fontSize="14" textAnchor="end" fill="#64748b">{Math.round(v)}€</text></g>)}
        {xt.map((t, i) => <text key={i} x={X(t)} y={H - 8} fontSize="14" textAnchor={i === 0 ? 'start' : i === 3 ? 'end' : 'middle'} fill="#64748b">{new Date(t).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' })}</text>)}
        {target && <g><line x1={L} x2={W - R} y1={Y(target)} y2={Y(target)} stroke="#16a34a" strokeDasharray="5 4" /><text x={W - R} y={Y(target) - 4} fontSize="14" textAnchor="end" fill="#16a34a">obiettivo {eur(target)}</text></g>}
        {keys.map((k, i) => {
          const arr = series[k].slice().sort((a, b) => a.ts - b.ts); const c = COLORS[i % COLORS.length];
          return <g key={k}>
            {arr.length > 1 && <polyline fill="none" stroke={c} strokeWidth="2.5" strokeLinejoin="round" points={arr.map(p => `${X(p.ts)},${Y(p.pp)}`).join(' ')} />}
            {arr.map(p => <circle key={p.id} cx={X(p.ts)} cy={Y(p.pp)} r="4" fill="#fff" stroke={c} strokeWidth="2"><title>{k}: {eur(p.pp)} · {fmtTs(p.ts)} · {p.fonte}</title></circle>)}
          </g>;
        })}
      </svg>
      <div className="legend">{keys.map((k, i) => <span key={k}><i style={{ background: COLORS[i % COLORS.length] }} />{k}</span>)}</div>
    </div>
  );
}

function SettingsTab({ data, store, onCheckUpdate }) {
  const imp = data.impostazioni || {};

  const fileRef = useRef(null);
  const exportJson = () => {
    const blob = new Blob([JSON.stringify({ viaggi: data.viaggi, prezzi: data.prezzi, impostazioni: data.impostazioni, scan: data.scan }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `voli-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  };
  const importJson = e => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(r.result); if (confirm('Sostituire tutti i dati con il backup?')) store.replaceAll(o); } catch (err) { alert('File non valido'); } };
    r.readAsText(file); e.target.value = '';
  };
  return (
    <div>
      {!FB_ON && <div className="banner"><b>Modalità locale.</b> I dati restano solo su questo dispositivo. Per sincronizzarli tra Mac e telefono incolla la config Firebase in <code>FIREBASE_CONFIG</code> dentro index.html.</div>}

        <h3>Dati</h3>

        <div className="row"><button className="btn sec" onClick={exportJson}>⬇ Esporta backup</button><button className="btn ghost" onClick={() => fileRef.current.click()}>⬆ Importa backup</button>
          <input ref={fileRef} type="file" accept="application/json" style={{ display: 'none' }} onChange={importJson} /></div>
      </div>
      <div className="card">
        <h3>Aggiorna app</h3>
        <div className="row"><span>Versione installata <b>{APP_VERSION}</b></span><div className="sp" />
          <button className="btn" disabled={checking} onClick={async () => { setChecking(true); setMsg(''); const v = await checkUpdate().catch(() => null); setChecking(false); if (v) onCheckUpdate(v); else setMsg('Hai già l\'ultima versione.'); }}>{checking ? 'Controllo…' : 'Controlla aggiornamenti'}</button>
          <button className="btn ghost" onClick={() => hardReload()}>Ricarica</button></div>
        {msg && <div className="mut small" style={{ marginTop: 8 }}>{msg}</div>}
      </div>
    </div>
  );
}

    initDone.current = true;
    const imp = data.impostazioni || {};
    setSearch(s => (s.origini.length ? s : { ...s, origini: imp.origini || [], adulti: imp.adulti || s.adulti }));
  }, [store.ready, data.impostazioni]);

  useEffect(() => {
    const run = () => checkUpdate().then(v => v && setNewVer(v)).catch(() => {});
    run();
    const t = setInterval(run, 10 * 60 * 1000);
    const vis = () => { if (document.visibilityState === 'visible') run(); };
    document.addEventListener('visibilitychange', vis);
    return () => { clearInterval(t); document.removeEventListener('visibilitychange', vis); };
  }, []);

  const saveTrip = () => {
    const s = search; const base = (s.tripId && data.viaggi[s.tripId]) || {};
    const typed = (s.nome || '').trim();
    const autoOld = base.id ? [defaultName(base), defaultName({ ...base, tipo: 'oa' })] : [];
    const t = {
      ...base, id: base.id || uid(), nome: (!typed || autoOld.includes(typed)) ? defaultName(s) : typed,
      origini: s.origini, destinazioni: s.ovunque ? [] : s.destinazioni, ovunque: s.ovunque, tipo: s.tipo, andata: s.andata,
      ritorno: s.tipo === 'ar' ? s.ritorno : '', adulti: s.adulti, flex: s.flex, target: base.target || null, note: base.note || '',
      archiviato: base.archiviato || false, creato: base.creato || Date.now(), aggiornato: Date.now()
    };
    store.update({ [`viaggi/${t.id}`]: t });
    setSearch(x => ({ ...x, tripId: t.id, nome: t.nome }));
    showToast('Viaggio salvato', { label: 'Apri', fn: () => goTrip(t.id) });
    return t;
  };
  const register = d => { let tripId = search.tripId; if (!tripId || !data.viaggi[tripId]) tripId = saveTrip().id; setDraft({ ...d, tripId }); };
  const savePrice = p => { store.update({ [`prezzi/${p.id}`]: p }); setDraft(null); showToast(`Prezzo salvato: ${eur(p.pp)}`, { label: 'Vedi storico', fn: () => goTrip(p.tripId) }); };
  const registerFor = t => setDraft({ tripId: t.id, origine: t.origini[0] || '', destinazione: t.destinazioni[0] || '', andata: t.andata, ritorno: t.ritorno, adulti: t.adulti });
  const openSearchFromTrip = t => {
    setSearch({ origini: t.origini || [], destinazioni: t.destinazioni || [], ovunque: !!t.ovunque, tipo: t.tipo || 'ar', andata: t.andata || '', ritorno: t.ritorno || '', adulti: t.adulti || 1, flex: t.flex || 0, tripId: t.id, nome: t.nome });
    setTab('cerca'); window.scrollTo(0, 0);
  };
  const deleteTrip = t => {
    if (!confirm(`Eliminare "${t.nome}" e tutte le sue rilevazioni?`)) return;
    const m = { [`viaggi/${t.id}`]: null };
    Object.values(data.prezzi || {}).filter(p => p.tripId === t.id).forEach(p => { m[`prezzi/${p.id}`] = null; });
    store.update(m); setTripView(null);
    if (search.tripId === t.id) setSearch(s => ({ ...s, tripId: null }));
  };

  const trip = tripView ? data.viaggi[tripView] : null;
  const st = store.status;
  const nActive = Object.values(data.viaggi || {}).filter(t => !t.archiviato).length;

  return (
    <>
      <header>
        <div className="top">
          <div className="brand"><svg className="logo" viewBox="5.5 12.5 57 39.5" width="34" height="24" aria-hidden="true"><polyline points="8,15 17,27 24,21 33,37 40.6,41.8" fill="none" stroke="#5eead4" strokeWidth="4.2" strokeLinecap="round" strokeLinejoin="round"/><g transform="translate(46,42) rotate(18)"><path d="M15 0 L-14 -10 L-5 1.5 Z" fill="#fff"/><path d="M15 0 L-5 1.5 L-10 11 Z" fill="#99f6e4"/></g></svg>Voli</div>
          <div className="status"><span className={'dot ' + (st === 'online' ? 'on' : st.startsWith('errore') ? 'err' : '')} />{st}</div>
        </div>
      </header>
      <main>
        {tab === 'cerca' && <SearchTab search={search} setSearch={setSearch} data={data} onSaveTrip={saveTrip} onRegister={register} onNew={() => setSearch(blankSearch(data.impostazioni))} onOpenTrip={goTrip} />}
        {tab === 'viaggi' && !trip && <TripsTab data={data} onOpen={goTrip} onSearch={openSearchFromTrip} onRegister={registerFor} />}
        {tab === 'viaggi' && trip && <TripDetail trip={trip} data={data} store={store} onBack={() => setTripView(null)} onOpenSearch={() => openSearchFromTrip(trip)}
          onEditPrice={p => setDraft(p)} onDelete={() => deleteTrip(trip)}
          onRegister={() => registerFor(trip)} />}
        {tab === 'imp' && <SettingsTab data={data} store={store} onCheckUpdate={v => setNewVer(v)} />}
        <div className="ver">Voli v{APP_VERSION}</div>
      </main>
      <nav className="tabbar"><div className="tabbar-in">
        <button className={tab === 'cerca' ? 'act' : ''} onClick={() => { setTab('cerca'); window.scrollTo(0, 0); }}><span className="ic">🔎</span>Cerca</button>
        <button className={tab === 'viaggi' ? 'act' : ''} onClick={() => { setTab('viaggi'); setTripView(null); window.scrollTo(0, 0); }}><span className="ic">🧳</span>Viaggi{nActive ? ` (${nActive})` : ''}</button>
        <button className={tab === 'imp' ? 'act' : ''} onClick={() => { setTab('imp'); window.scrollTo(0, 0); }}><span className="ic">⚙️</span>Impostazioni</button>
      </div></nav>
      {toast && <div className="toast"><span>{toast.msg}</span>{toast.action && <button onClick={() => { toast.action.fn(); setToast(null); }}>{toast.action.label}</button>}</div>}
      {draft && <PriceModal draft={draft} onClose={() => setDraft(null)} onSave={savePrice} />}
      {newVer && (
        <div className="modal-bg pop">
          <div className="modal">
            <div className="big">🚀</div>
            <h2>Nuova versione disponibile</h2>
            <p className="mut">Versione <b>{newVer}</b> (installata {APP_VERSION})</p>
            <button className="btn full" onClick={() => hardReload(newVer)}>Aggiorna ora</button>
            <button className="btn ghost full" style={{ marginTop: 8 }} onClick={() => setNewVer(null)}>Più tardi</button>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
